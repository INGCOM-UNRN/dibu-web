# Publica el editor en GitHub Pages.
#  - en cada push a main,
#  - cuando dibu publica un release (repository_dispatch "dibu-release", lo envía release.yml de dibu),
#  - o a mano, eligiendo contra qué rama/tag de dibu compilar.
# Sitio: https://ingcom-unrn.github.io/dibu-web/ (Pages con origen "GitHub Actions").
name: Publicar editor

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [dibu-release]
  workflow_dispatch:
    inputs:
      dibu_ref:
        description: Rama, tag o commit de dibu
        default: main

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    uses: ./.github/workflows/construir.yml
    with:
      dibu_ref: ${{ github.event.client_payload.ref || inputs.dibu_ref || 'main' }}

  desplegar:
    name: Desplegar en Pages
    needs: construir
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: editor
          path: sitio
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: sitio
      - id: despliegue
        uses: actions/deploy-pages@v5
