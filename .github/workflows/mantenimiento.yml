# Tareas periódicas:
#  - compatibilidad: compila y prueba contra la rama main de dibu, para detectar
#    cuanto antes cambios del motor que rompan el editor (la auditoría RustSec del motor
#    corre en dibu).
name: Mantenimiento

on:
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibilidad:
    name: Compatibilidad con dibu main
    uses: ./.github/workflows/construir.yml
    with:
      dibu_ref: main

