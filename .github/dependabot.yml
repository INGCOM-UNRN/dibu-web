# El motor WASM es el crate dibu-wasm del repositorio dibu, que tiene su propio Dependabot.
# Aquí sólo las Actions.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
